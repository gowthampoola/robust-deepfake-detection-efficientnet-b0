# ==============================================================================
# Robust Deepfake Image Detection Under Real-World Post-Processing (EfficientNet-B0)
# Project Configuration File
# ==============================================================================

project:
  name: "Deepfake Detection - EfficientNet-B0 Robustness"
  version: "1.0.0"
  description: "Robust deepfake image detection under real-world post-processing using EfficientNet-B0"
  seed: 42

dataset:
  name: "140k Real and Fake Faces"
  source: "Kaggle (xhlulu/140k-real-and-fake-faces)"
  real_source: "Flickr-Faces-HQ (FFHQ)"
  fake_source: "StyleGAN Synthesized Faces"
  data_dir: "data/real_vs_fake/real-vs-fake"
  train_dir: "data/real_vs_fake/real-vs-fake/train"
  valid_dir: "data/real_vs_fake/real-vs-fake/valid"
  test_dir: "data/real_vs_fake/real-vs-fake/test"
  classes:
    0: "FAKE"
    1: "REAL"
  subsets:
    train_per_class: 10000    # 20,000 total balanced
    valid_per_class: 2000     # 4,000 total balanced
    test_per_class: 10000     # 20,000 total independent test set

model:
  backbone: "efficientnet_b0"
  pretrained_weights: "DEFAULT"  # ImageNet-1k
  num_classes: 2
  dropout_rate: 0.20
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  paths:
    model_dir: "models"
    baseline_checkpoint: "models/efficientnet_b0_baseline_best.pth"
    robust_checkpoint: "models/efficientnet_b0_robust_best.pth"
    sanity_checkpoint: "models/efficientnet_b0_baseline_sanity.pth"

training:
  batch_size: 32
  num_workers: 0
  pin_memory: true
  baseline:
    epochs: 5
    learning_rate: 0.0001
    optimizer: "Adam"
    loss: "CrossEntropyLoss"
  robust:
    epochs: 5
    learning_rate: 0.00005
    optimizer: "Adam"
    loss: "CrossEntropyLoss"
    augmentation_probability: 0.70
    augmentations:
      jpeg_qualities: [30, 40, 50, 60]
      resize_resolutions: [96, 112, 128]
      blur_radii: [0.5, 1.0, 1.5, 2.0]
      noise_std_range: [0.02, 0.08]
      contrast_factor_range: [1.1, 1.5]
      sharpness_factor_range: [1.2, 2.0]

evaluation:
  batch_size: 32
  stress_test_conditions:
    clean:
      enabled: true
      description: "Clean unaltered test images"
    jpeg:
      enabled: true
      quality: 50
      description: "JPEG compression with quality factor 50"
    resize:
      enabled: true
      downscale_dim: 112
      restore_dim: 256
      description: "Spatial downsampling to 112x112 and restoration to 256x256"
    blur:
      enabled: true
      radius: 2.0
      description: "Gaussian blur with radius 2.0"
    noise:
      enabled: true
      std: 0.05
      description: "Additive white Gaussian noise with std 0.05"
    enhancement:
      enabled: true
      contrast: 1.5
      sharpness: 2.0
      description: "Contrast enhancement (1.5x) followed by sharpness enhancement (2.0x)"
